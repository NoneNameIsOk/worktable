[package]
name = "worktable-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

[dependencies]
worktable-core = { path = "../crates/worktable-core" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
